[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-chart-analysis-monitor"
version = "0.1.0"
description = "Local, read-only chart analysis and persistent price monitoring"
requires-python = ">=3.11"
dependencies = ["matplotlib>=3.9,<4"]

[project.optional-dependencies]
browser = ["playwright>=1.49,<2"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "pyyaml>=6,<7"]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
